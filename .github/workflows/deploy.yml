name: terraform infra and deploy
on:
    workflow_dispatch:
    push:
        branches:
            - main
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
            - name: Azure Login
              uses: azure/login@v1
              with:
                creds: ${{ secrets.AZURE_SECRET }}
            # - name: setup terraform
            #   uses: hashicorp/setup-terraform@v3
            # - name: terraform init
            #   working-directory: terraform
            #   run: terraform init
            # - name: terraform apply
            #   working-directory: terraform
            #   run: terraform apply -auto-approve


            - name: setup dotnet
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: '10.0.x'
            - name: restore dependencies
              run: dotnet restore
            - name: publish application
              run: dotnet publish HDFCApplication.csproj -c Release -o publish
            - name: show repo structure
              run: ls -R
